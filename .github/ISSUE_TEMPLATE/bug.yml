name: Bug report
description: Something is broken or not behaving as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps or a minimal code sample.
      render: tsx
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vizora version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "React 19, Vite 5, Chrome 130"
