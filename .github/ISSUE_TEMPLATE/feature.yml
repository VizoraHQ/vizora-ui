name: Feature request
description: Suggest a new chart, AI visual, or capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Sketch the API or component you'd like.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What have you tried in other libraries?
